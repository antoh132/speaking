<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakOn! — Daftar Akun Siswa</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .register-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .register-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .register-logo img {
      width: 280px;
      height: auto;
      object-fit: contain;
      margin-bottom: 0.5rem;
    }

    .register-badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1a73e8;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.2rem 0.75rem;
      border-radius: 20px;
      margin-top: 0.5rem;
      letter-spacing: 0.03em;
    }

    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #333;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .form-group input.error {
      border-color: #e53935;
    }

    .field-error {
      color: #e53935;
      font-size: 0.8rem;
      margin-top: 0.3rem;
      display: none;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 2.8rem;
    }

    .toggle-password {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: #888;
      font-size: 1rem;
      padding: 0;
      line-height: 1;
    }

    .toggle-password:hover {
      color: #1a73e8;
    }

    .password-strength {
      margin-top: 0.4rem;
      height: 4px;
      border-radius: 2px;
      background: #eee;
      overflow: hidden;
    }

    .password-strength-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s, background 0.3s;
      width: 0%;
    }

    .strength-text {
      font-size: 0.75rem;
      margin-top: 0.25rem;
      color: #888;
    }

    .btn-register {
      width: 100%;
      padding: 0.85rem;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-register:hover:not(:disabled) {
      background: #1557b0;
    }

    .btn-register:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .alert.error {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .login-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.88rem;
      color: #555;
    }

    .login-link a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }

    .login-link a:hover {
      text-decoration: underline;
    }

    .back-link {
      float: left;
      font-size: 0.82rem;
      color: #1a73e8;
      text-decoration: none;
      line-height: 2;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .top-bar {
      overflow: hidden;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="register-card">

    <!-- Top bar -->
    <div class="top-bar">
      <a href="login.html" class="back-link">← Kembali ke Login</a>
    </div>

    <!-- Logo -->
    <div class="register-logo">
      <img src="/speakon/frontend/images/logo-text.jpeg" alt="SpeakOn! Logo" />
      <br>
      <span class="register-badge">Pendaftaran Siswa</span>
    </div>

    <!-- Alert -->
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>

    <!-- Register form -->
    <form id="register-form" novalidate>

      <!-- Nama Lengkap -->
      <div class="form-group">
        <label for="full_name">Nama Lengkap</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          autocomplete="name"
          placeholder="Masukkan nama lengkap Anda"
          required
        />
        <div class="field-error" id="err-full_name"></div>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="Masukkan email Anda"
          required
        />
        <div class="field-error" id="err-email"></div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            placeholder="Minimal 8 karakter"
            required
          />
          <button type="button" class="toggle-password" onclick="togglePassword('password')" aria-label="Tampilkan password">
            👁
          </button>
        </div>
        <div class="password-strength">
          <div class="password-strength-bar" id="strength-bar"></div>
        </div>
        <div class="strength-text" id="strength-text"></div>
        <div class="field-error" id="err-password"></div>
      </div>

      <!-- Konfirmasi Password -->
      <div class="form-group">
        <label for="confirm_password">Konfirmasi Password</label>
        <div class="password-wrapper">
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            autocomplete="new-password"
            placeholder="Ulangi password Anda"
            required
          />
          <button type="button" class="toggle-password" onclick="togglePassword('confirm_password')" aria-label="Tampilkan konfirmasi password">
            👁
          </button>
        </div>
        <div class="field-error" id="err-confirm_password"></div>
      </div>

      <button type="submit" id="btn-submit" class="btn-register">
        Daftar Sekarang
      </button>
    </form>

    <div class="login-link">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>

  </div>

  <!-- Scripts -->
  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/auth.js"></script>
  <script>
    // Redirect jika sudah login
    if (auth.isAuthenticated()) {
      auth.redirectToDashboard();
    }

    // ── Alert helper ──────────────────────────────────────────────────────────
    function showAlert(message, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent  = message;
      el.className    = `alert ${type}`;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    // ── Field error helper ────────────────────────────────────────────────────
    function showFieldError(fieldId, message) {
      const input = document.getElementById(fieldId);
      const err   = document.getElementById('err-' + fieldId);
      if (input) input.classList.add('error');
      if (err)   { err.textContent = message; err.style.display = 'block'; }
    }

    function clearFieldErrors() {
      document.querySelectorAll('.field-error').forEach(el => {
        el.style.display = 'none';
        el.textContent   = '';
      });
      document.querySelectorAll('input.error').forEach(el => {
        el.classList.remove('error');
      });
    }

    // ── Toggle password visibility ────────────────────────────────────────────
    function togglePassword(fieldId) {
      const input = document.getElementById(fieldId);
      input.type  = input.type === 'password' ? 'text' : 'password';
    }

    // ── Password strength indicator ───────────────────────────────────────────
    document.getElementById('password').addEventListener('input', function () {
      const val  = this.value;
      const bar  = document.getElementById('strength-bar');
      const text = document.getElementById('strength-text');

      let score = 0;
      if (val.length >= 8)              score++;
      if (/[A-Z]/.test(val))            score++;
      if (/[0-9]/.test(val))            score++;
      if (/[^A-Za-z0-9]/.test(val))     score++;

      const levels = [
        { width: '0%',   color: '#eee',    label: '' },
        { width: '25%',  color: '#e53935', label: 'Lemah' },
        { width: '50%',  color: '#fb8c00', label: 'Cukup' },
        { width: '75%',  color: '#fdd835', label: 'Baik' },
        { width: '100%', color: '#43a047', label: 'Kuat' },
      ];

      const level = val.length === 0 ? levels[0] : levels[score] || levels[1];
      bar.style.width      = level.width;
      bar.style.background = level.color;
      text.textContent     = level.label;
      text.style.color     = level.color;
    });

    // ── Form validation ───────────────────────────────────────────────────────
    function validateForm(fullName, email, password, confirmPassword) {
      let valid = true;

      if (fullName.trim().length < 2) {
        showFieldError('full_name', 'Nama lengkap minimal 2 karakter.');
        valid = false;
      }

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError('email', 'Format email tidak valid.');
        valid = false;
      }

      if (password.length < 8) {
        showFieldError('password', 'Password minimal 8 karakter.');
        valid = false;
      }

      if (password !== confirmPassword) {
        showFieldError('confirm_password', 'Konfirmasi password tidak cocok.');
        valid = false;
      }

      return valid;
    }

    // ── Form submit ───────────────────────────────────────────────────────────
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      clearFieldErrors();

      const fullName        = document.getElementById('full_name').value;
      const email           = document.getElementById('email').value.trim();
      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const btn             = document.getElementById('btn-submit');

      if (!validateForm(fullName, email, password, confirmPassword)) return;

      btn.disabled    = true;
      btn.textContent = 'Mendaftarkan...';

      try {
        await api.post('/auth/register', {
          full_name:        fullName.trim(),
          email:            email,
          password:         password,
          confirm_password: confirmPassword,
        });

        showAlert('Akun berhasil dibuat! Mengarahkan ke halaman login...', 'success');

        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);

      } catch (error) {
        btn.disabled    = false;
        btn.textContent = 'Daftar Sekarang';

        const code = error?.code || '';

        if (code === 'EMAIL_ALREADY_EXISTS') {
          showFieldError('email', 'Email sudah terdaftar. Gunakan email lain.');
        } else if (code === 'VALIDATION_ERROR') {
          showAlert(error.message || 'Data yang dimasukkan tidak valid.');
        } else if (code === 'NETWORK_ERROR') {
          showAlert('Gagal terhubung ke server. Periksa koneksi internet Anda.');
        } else {
          showAlert(error.message || 'Terjadi kesalahan. Silakan coba lagi.');
        }
      }
    });

    // Clear field error on input
    ['full_name', 'email', 'password', 'confirm_password'].forEach(id => {
      document.getElementById(id).addEventListener('input', function () {
        this.classList.remove('error');
        const err = document.getElementById('err-' + id);
        if (err) { err.style.display = 'none'; err.textContent = ''; }
      });
    });
  </script>
</body>
</html>
