<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeakOn! — Login</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ── Login page styles ── */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 400px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .login-logo img {
      width: 280px;
      height: auto;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: #333;
      font-size: 0.9rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s;
      box-sizing: border-box;
    }

    .form-group input:focus {
      outline: none;
      border-color: #1a73e8;
    }

    .btn-login {
      width: 100%;
      padding: 0.85rem;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      background: #1557b0;
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .alert {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      display: none;
    }

    .alert.error {
      background: #fdecea;
      color: #c62828;
      border: 1px solid #ef9a9a;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .alert.warning {
      background: #fff8e1;
      color: #f57f17;
      border: 1px solid #ffe082;
    }

    .lang-switcher {
      text-align: right;
      margin-bottom: 1rem;
    }

    .lang-switcher button {
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      color: #555;
      margin-left: 0.25rem;
    }

    .lang-switcher button.active {
      background: #1a73e8;
      color: #fff;
      border-color: #1a73e8;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- Language switcher -->
    <div class="lang-switcher">
      <a href="index.html" style="float:left;font-size:.82rem;color:#1a73e8;text-decoration:none;line-height:2">← Beranda</a>
      <button id="btn-lang-id" class="active" onclick="switchLang('id')">ID</button>
      <button id="btn-lang-en" onclick="switchLang('en')">EN</button>
    </div>

    <!-- Logo -->
    <div class="login-logo">
      <img src="/speakon/frontend/images/logo-text.jpeg" alt="SpeakOn! Logo" />
    </div>

    <!-- Alert messages -->
    <div id="alert" class="alert" role="alert" aria-live="polite"></div>

    <!-- Login form -->
    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="email" data-i18n="auth.email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          autocomplete="email"
          required
          data-i18n-placeholder="auth.emailPlaceholder"
          placeholder="Masukkan email Anda"
        />
      </div>

      <div class="form-group">
        <label for="password" data-i18n="auth.password">Kata Sandi</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
          data-i18n-placeholder="auth.passwordPlaceholder"
          placeholder="Masukkan kata sandi Anda"
        />
      </div>

      <button type="submit" id="btn-submit" class="btn-login" data-i18n="auth.loginButton">
        Masuk
      </button>
    </form>

    <div style="text-align:center;margin-top:1.25rem;font-size:0.88rem;color:#555;">
      Belum punya akun? <a href="register.html" style="color:#1a73e8;text-decoration:none;font-weight:600;">Daftar sebagai Siswa</a>
    </div>
  </div>

  <!-- Scripts -->
  <script src="frontend/js/i18n.js"></script>
  <script src="frontend/js/api.js"></script>
  <script src="frontend/js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (auth.isAuthenticated()) {
      auth.redirectToDashboard();
    }

    // Initialise i18n
    i18n.init();

    // Language switcher
    function switchLang(lang) {
      i18n.setLanguage(lang);
      document.getElementById('btn-lang-id').classList.toggle('active', lang === 'id');
      document.getElementById('btn-lang-en').classList.toggle('active', lang === 'en');
    }

    // Alert helper
    function showAlert(message, type = 'error') {
      const el = document.getElementById('alert');
      el.textContent = message;
      el.className   = `alert ${type}`;
      el.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('alert').style.display = 'none';
    }

    // Login form submission
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('btn-submit');

      if (!email || !password) {
        showAlert(i18n.t('auth.errors.invalidCredentials'));
        return;
      }

      btn.disabled   = true;
      btn.textContent = i18n.t('auth.loggingIn');

      try {
        const { user, redirectPath } = await auth.login(email, password);
        showAlert(i18n.t('auth.loginSuccess'), 'success');

        setTimeout(() => {
          window.location.href = redirectPath || auth.getRedirectPath(user.role);
        }, 800);

      } catch (error) {
        btn.disabled    = false;
        btn.textContent = i18n.t('auth.loginButton');

        const code = error?.code || '';

        if (code === 'ACCOUNT_LOCKED') {
          showAlert(i18n.t('auth.errors.accountLocked', { minutes: 15 }), 'warning');
        } else if (code === 'ACCOUNT_INACTIVE') {
          showAlert(i18n.t('auth.errors.accountInactive'), 'warning');
        } else if (code === 'NETWORK_ERROR') {
          showAlert(i18n.t('auth.errors.networkError'));
        } else {
          showAlert(i18n.t('auth.errors.invalidCredentials'));
        }
      }
    });
  </script>
</body>
</html>
