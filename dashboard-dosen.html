    .btn:hover{opacity:.85}
    .btn-white{background:#fff;color:#1a73e8}
    .btn-primary{background:#1a73e8;color:#fff}
    .btn-success{background:#43a047;color:#fff}
    .btn-sm{padding:.3rem .65rem;font-size:.78rem}

    .recording-list{display:grid;gap:1rem}

    .rec-meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:#666;margin-bottom:.75rem}

    .badge-pending{background:#fff8e1;color:#f57f17}

// ── Load levels for filter ────────────────────────────────────────────────────
async function loadLevelFilter(){
  try{
    const r = await api.get('/levels');
    const sel = document.getElementById('filter-level');
    r.data.levels.forEach(l=>{
      const opt = document.createElement('option');
      opt.value = l.id;
      opt.textContent = l.name;
      sel.appendChild(opt);
    });
  }catch(e){}
}

// ── Load recordings ───────────────────────────────────────────────────────────
let allRecordings = [];
let feedbackMap   = {};

async function loadRecordings(){
  const studentSearch = document.getElementById('filter-student').value.toLowerCase();
  const levelId       = document.getElementById('filter-level').value;
  const statusFilter  = document.getElementById('filter-status').value;

  try{
    const params = { limit: 200 };
    if(levelId) params.level_id = levelId;

    // "pending" dan "current" hanya ambil rekaman terbaru per siswa per level
    if(statusFilter === 'pending' || statusFilter === 'current') {
      params.current_only = 1;
    }

    const r = await api.get('/recordings', params);
    allRecordings = r.data.recordings;

    // Load semua feedback
    const fbResp = await api.get('/feedback', { limit: 500 });
    feedbackMap  = {};
    fbResp.data.feedback.forEach(f=>{ feedbackMap[f.recording_id] = f; });

    // Filter berdasarkan status
    let filtered = allRecordings;
    if(studentSearch) filtered = filtered.filter(r=>r.student_name.toLowerCase().includes(studentSearch));
    if(statusFilter === 'pending') filtered = filtered.filter(r=>!feedbackMap[r.id]);

    // Urutkan: belum dinilai dulu, lalu terbaru
    filtered.sort((a, b) => {
      const aHasFb = !!feedbackMap[a.id];
      const bHasFb = !!feedbackMap[b.id];
      if(aHasFb !== bHasFb) return aHasFb ? 1 : -1; // belum dinilai di atas
      return new Date(b.uploaded_at) - new Date(a.uploaded_at); // terbaru di atas
    });

    renderRecordings(filtered);
    filtered.forEach(rec => {
      loadAudioBlob(rec.id);         // Step 3 main recording
      loadTaskAudioBlobs(rec.id, rec.level_order || rec.level_id); // Step 2 task recordings
    });
  }catch(e){
    document.getElementById('rec-list').innerHTML = `<div class="empty-state" style="color:#c62828">Gagal memuat: ${e.message||'Error'}</div>`;
  }
}

function renderRecordings(recs){
  const container = document.getElementById('rec-list');
  if(!recs.length){
    container.innerHTML = '<div class="empty-state">Tidak ada rekaman yang perlu dinilai.</div>';
    return;
  }

  container.innerHTML = recs.map(rec=>{
    const fb       = feedbackMap[rec.id];
    const hasFb    = !!fb;
    const levelNum = rec.level_order || rec.level_id;
    const topic    = LEVEL_TOPICS[levelNum] || rec.level_name;
    const steps    = LEVEL_STEPS[levelNum]?.steps || [];

    // Parse existing step comments from feedback comment
    let stepComments = {1:'',2:'',3:'',4:''};
    let stepScores   = {1:'',2:'',3:'',4:''};
    if(hasFb && fb.comment){
      // Format: [S1:score|comment][S2:score|comment]...
      const matches = fb.comment.matchAll(/\[S(\d):([^|]*)\|([^\]]*)\]/g);
      for(const m of matches){
        stepScores[m[1]]   = m[2];
        stepComments[m[1]] = m[3];
      }
      // Fallback: jika format lama (plain text), taruh di step 3
      if(!fb.comment.includes('[S1:') && !fb.comment.includes('[S3:')){
        stepComments[3] = fb.comment;
      }
    }

    const stepTabs = steps.map(s =>
      `<div class="step-tab-dosen ${s.num===3?'active':''}" onclick="switchStepTab('${rec.id}',${s.num})" id="stab-${rec.id}-${s.num}">
        ${s.icon} ${s.label}
      </div>`
    ).join('');

    const stepPanels = steps.map(s => {
      const sc = stepScores[s.num];
      const cc = stepComments[s.num];
      const content = LEVEL_CONTENT[levelNum];

      // Build soal detail per step
      let soalHtml = '';
      if(content){
        if(s.num === 1){
          soalHtml = `
            <div style="background:#f0f7ff;border:1px solid #bbdefb;border-radius:8px;padding:.75rem;margin-bottom:.6rem">
              <div style="font-size:.75rem;font-weight:700;color:#1565c0;margin-bottom:.35rem">🔊 AUDIO MODEL YANG DIDENGAR SISWA:</div>
              <div style="font-size:.85rem;color:#1a237e;font-style:italic">"${content.model}"</div>
            </div>`;
        } else if(s.num === 2 && content.tasks){
          soalHtml = `
            <div style="background:#f3e5f5;border:1px solid #ce93d8;border-radius:8px;padding:.75rem;margin-bottom:.6rem">
              <div style="font-size:.75rem;font-weight:700;color:#6a1b9a;margin-bottom:.5rem">✏️ SOAL LATIHAN YANG DIKERJAKAN SISWA:</div>
              ${content.tasks.map((t,i)=>`
                <div style="margin-bottom:.5rem;padding:.5rem;background:#fff;border-radius:6px;border-left:3px solid #9c27b0">
                  <div style="font-size:.75rem;font-weight:700;color:#6a1b9a">${t.label}</div>
                  <div style="font-size:.83rem;color:#333;margin-top:.2rem">${t.prompt}</div>
                </div>`).join('')}
              <div style="margin-top:.6rem;padding-top:.6rem;border-top:1px dashed #ce93d8">
                <div style="font-size:.75rem;font-weight:700;color:#6a1b9a;margin-bottom:.4rem">🎤 Rekaman Latihan Siswa:</div>
                <div id="task-audio-0-${rec.id}"><span style="font-size:.78rem;color:#888">⏳ Memuat Latihan 1...</span></div>
                <div id="task-audio-1-${rec.id}" style="margin-top:.3rem"><span style="font-size:.78rem;color:#888">⏳ Memuat Latihan 2...</span></div>
                <div id="task-audio-2-${rec.id}" style="margin-top:.3rem"><span style="font-size:.78rem;color:#888">⏳ Memuat Latihan 3...</span></div>
              </div>
            </div>`;
        } else if(s.num === 3){
          soalHtml = `
            <div style="background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:.75rem;margin-bottom:.6rem">
              <div style="font-size:.75rem;font-weight:700;color:#f57f17;margin-bottom:.35rem">🎤 PROMPT REKAMAN SISWA:</div>
              <div style="font-size:.88rem;color:#333;font-weight:600">"${content.recPrompt}"</div>
            </div>`;
        } else if(s.num === 4 && content.scenarios){
          soalHtml = `
            <div style="background:#e8f5e9;border:1px solid #a5d6a7;border-radius:8px;padding:.75rem;margin-bottom:.6rem">
              <div style="font-size:.75rem;font-weight:700;color:#2e7d32;margin-bottom:.5rem">🎭 SKENARIO YANG DIPRAKTIKKAN SISWA:</div>
              ${content.scenarios.map((sc,i)=>`
                <div style="margin-bottom:.5rem;padding:.5rem;background:#fff;border-radius:6px;border-left:3px solid #43a047">
                  <div style="font-size:.75rem;font-weight:700;color:#2e7d32">Skenario ${i+1}: ${sc.tag}</div>
                  <div style="font-size:.83rem;color:#333;margin-top:.2rem">${sc.text}</div>
                </div>`).join('')}
            </div>`;
        }
      }

      return `
      <div class="step-panel-dosen ${s.num===3?'active':''}" id="spanel-${rec.id}-${s.num}">
        ${soalHtml}
        <div class="step-content-preview">${s.desc}</div>
        <div style="font-size:.8rem;color:#555;margin-bottom:.4rem;font-weight:600">📋 Kriteria Penilaian: <em style="font-weight:400">${s.criteria}</em></div>
        <div class="step-score">
          <label><input type="radio" name="score-${rec.id}-${s.num}" value="baik" ${sc==='baik'?'checked':''}> ✅ Baik</label>
          <label><input type="radio" name="score-${rec.id}-${s.num}" value="cukup" ${sc==='cukup'?'checked':''}> 🟡 Cukup</label>
          <label><input type="radio" name="score-${rec.id}-${s.num}" value="perlu_latihan" ${sc==='perlu_latihan'?'checked':''}> 🔴 Perlu Latihan</label>
        </div>
        <textarea class="step-comment" id="scomment-${rec.id}-${s.num}" placeholder="Catatan untuk step ini (opsional)...">${cc}</textarea>
      </div>`;
    }).join('');

    return `
    <div class="rec-card ${hasFb?'has-feedback':''}" id="card-${rec.id}">
      <div class="rec-meta">
        <span><strong>👤 Siswa:</strong> ${rec.student_name}</span>
        <span><strong>📚 Level ${levelNum}:</strong> ${topic}</span>
        <span><strong>📅 Diupload:</strong> ${fmtDate(rec.uploaded_at)}</span>
        <span><strong>📦 Ukuran:</strong> ${fmtSize(rec.file_size_bytes)}</span>
        ${rec.is_current ? '<span style="background:#e3f2fd;color:#1565c0;padding:.2rem .55rem;border-radius:20px;font-size:.75rem;font-weight:600">🔄 Rekaman Terbaru</span>' : '<span style="background:#f5f5f5;color:#999;padding:.2rem .55rem;border-radius:20px;font-size:.75rem">📁 Rekaman Lama</span>'}
        ${hasFb
          ? `<span class="badge ${fb.pass_status==='lulus'?'badge-lulus':'badge-tidak'}">${fb.pass_status==='lulus'?'✅ Lulus':'❌ Tidak Lulus'}</span>`
          : '<span class="badge badge-pending">⏳ Belum Dinilai</span>'}
      </div>

      <!-- Audio player -->
      <div class="audio-wrap" id="audio-wrap-${rec.id}">
        <div style="font-size:.8rem;color:#888;margin-bottom:.3rem">⏳ Memuat audio rekaman Step 3...</div>
      </div>

      <!-- Penilaian per step -->
      <div style="margin-top:.75rem">
        <div style="font-size:.85rem;font-weight:700;color:#333;margin-bottom:.5rem">📊 Penilaian Per Tahap:</div>
        <div class="step-tabs-dosen">${stepTabs}</div>
        <div id="stepanels-${rec.id}">${stepPanels}</div>
      </div>

      <!-- Kesimpulan & Submit -->
      <div class="feedback-form" id="form-${rec.id}" style="margin-top:.75rem;padding-top:.75rem;border-top:2px solid #f0f0f0">
        <div id="alert-${rec.id}" class="alert"></div>
        <label style="font-size:.83rem;font-weight:600;color:#444;display:block;margin-bottom:.35rem">
          💬 Kesimpulan Feedback Keseluruhan <span style="color:#999;font-weight:400">(minimal 10 karakter)</span>
        </label>
        <textarea id="comment-${rec.id}"
          placeholder="Tulis kesimpulan penilaian keseluruhan untuk siswa..."
          style="width:100%;padding:.6rem .85rem;border:1.5px solid #ddd;border-radius:7px;font-size:.88rem;resize:vertical;min-height:70px"
        >${hasFb ? extractSummary(fb.comment) : ''}</textarea>
        <div style="display:flex;gap:1.5rem;margin:.6rem 0;flex-wrap:wrap">
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem;font-weight:700;color:#2e7d32">
            <input type="radio" name="pass-${rec.id}" value="lulus" ${hasFb&&fb.pass_status==='lulus'?'checked':''} style="accent-color:#43a047;width:16px;height:16px" />
            ✅ Lulus — Level berikutnya terbuka
          </label>
          <label style="display:flex;align-items:center;gap:.4rem;cursor:pointer;font-size:.9rem;font-weight:700;color:#c62828">
            <input type="radio" name="pass-${rec.id}" value="tidak_lulus" ${hasFb&&fb.pass_status==='tidak_lulus'?'checked':''} style="accent-color:#e53935;width:16px;height:16px" />
            ❌ Tidak Lulus — Siswa rekam ulang
          </label>
        </div>
        <button class="btn btn-primary btn-sm" onclick="submitFeedback('${rec.id}','${hasFb?fb.id:''}')">
          ${hasFb ? '💾 Perbarui Feedback' : '📤 Kirim Feedback'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function switchStepTab(recId, stepNum){
  for(let i=1;i<=4;i++){
    const tab   = document.getElementById(`stab-${recId}-${i}`);
    const panel = document.getElementById(`spanel-${recId}-${i}`);
    if(tab)   tab.classList.toggle('active', i===stepNum);
    if(panel) panel.classList.toggle('active', i===stepNum);
  }
}

function extractSummary(comment){
  // Extract summary from structured comment format
  const match = comment.match(/\[SUMMARY:([^\]]*)\]/);
  if(match) return match[1];
  // Fallback: if old format, return as-is
  if(!comment.includes('[S1:') && !comment.includes('[S3:')) return comment;
  return '';
}

// ── Load audio via fetch (kirim JWT token) ────────────────────────────────────
async function loadAudioBlob(recId){
  const wrap = document.getElementById(`audio-wrap-${recId}`);
  if(!wrap) return;
  try{
    const token   = api.getAccessToken();
    // Deteksi base URL sama seperti api.js
    const basePath = window.location.pathname.startsWith('/speakon/') ? '/speakon/api' : '/api';
    const streamUrl = `${basePath}/recordings/${recId}/stream`;

    const resp = await fetch(streamUrl, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if(!resp.ok){
      const errText = await resp.text().catch(()=>'');
      wrap.innerHTML = `<div style="color:#c62828;font-size:.82rem">⚠️ Gagal memuat audio (${resp.status}). ${errText}</div>`;
      return;
    }

    const blob = await resp.blob();
    const url  = URL.createObjectURL(blob);
    wrap.innerHTML = `
      <div style="font-size:.78rem;color:#666;margin-bottom:.3rem">🎤 Rekaman Step 3 siswa:</div>
      <audio controls style="width:100%;border-radius:6px;margin-top:.25rem">
        <source src="${url}" type="audio/webm" />
        <source src="${url}" type="audio/ogg" />
        <source src="${url}" type="audio/mpeg" />
        Browser tidak mendukung audio player.
      </audio>`;
  }catch(e){
    wrap.innerHTML = `<div style="color:#c62828;font-size:.82rem">⚠️ Gagal memuat audio: ${e.message}</div>`;
  }
}

// ── Load task audio recordings (Step 2) ──────────────────────────────────────
async function loadTaskAudioBlobs(mainRecId, levelNum){
  const basePath  = window.location.pathname.startsWith('/speakon/') ? '/speakon/api' : '/api';
  const token     = api.getAccessToken();
  const content   = LEVEL_CONTENT[levelNum];
  const taskLabels = content?.tasks?.map(t => t.label) || ['Latihan 1','Latihan 2','Latihan 3'];

  try {
    const r = await api.get('/recordings', { limit: 200 });
    const allRecs = r.data.recordings;
    const mainRec = allRecs.find(rec => rec.id === mainRecId);
    if(!mainRec) return;

    for(let i = 0; i < 3; i++){
      const wrap = document.getElementById(`task-audio-${i}-${mainRecId}`);
      if(!wrap) continue;

      const taskRec = allRecs.find(rec =>
        rec.student_id === mainRec.student_id &&
        rec.level_id   === mainRec.level_id &&
        rec.task_index == i &&
        rec.is_current == 1
      );

      if(!taskRec){
        wrap.innerHTML = `<div style="font-size:.78rem;color:#bbb;padding:.2rem 0">— ${taskLabels[i]}: belum direkam</div>`;
        continue;
      }

      try {
        const resp = await fetch(`${basePath}/recordings/${taskRec.id}/stream`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if(!resp.ok){ wrap.innerHTML = `<div style="font-size:.78rem;color:#c62828">⚠️ Gagal load ${taskLabels[i]}</div>`; continue; }
        const blob = await resp.blob();
        const url  = URL.createObjectURL(blob);
        wrap.innerHTML = `
          <div style="font-size:.75rem;font-weight:600;color:#6a1b9a;margin-bottom:.2rem">${taskLabels[i]}:</div>
          <audio controls style="width:100%;height:34px;border-radius:5px">
            <source src="${url}" type="audio/webm"/>
            <source src="${url}" type="audio/ogg"/>
          </audio>`;
      } catch(e) {
        wrap.innerHTML = `<div style="font-size:.78rem;color:#c62828">⚠️ ${e.message}</div>`;
      }
    }
  } catch(e) {
    console.warn('loadTaskAudioBlobs error:', e);
  }
}

async function submitFeedback(recId, existingFbId){
  const summary    = document.getElementById(`comment-${recId}`).value.trim();
  const passStatus = document.querySelector(`input[name="pass-${recId}"]:checked`)?.value;
  const alertEl    = document.getElementById(`alert-${recId}`);

  function showA(msg, type='error'){
    alertEl.textContent=msg; alertEl.className=`alert ${type}`; alertEl.style.display='block';
    setTimeout(()=>alertEl.style.display='none', 5000);
  }

  if(!summary){ showA('Kesimpulan feedback wajib diisi.'); return; }
  if(summary.length < 10){ showA('Kesimpulan minimal 10 karakter.'); return; }
  if(!passStatus){ showA('Pilih status penilaian (Lulus / Tidak Lulus).'); return; }

  // Kumpulkan penilaian per step
  let stepParts = '';
  for(let i=1;i<=4;i++){
    const score   = document.querySelector(`input[name="score-${recId}-${i}"]:checked`)?.value || '';
    const comment = document.getElementById(`scomment-${recId}-${i}`)?.value.trim() || '';
    stepParts += `[S${i}:${score}|${comment}]`;
  }

  // Format comment: step details + summary
  const fullComment = `${stepParts}[SUMMARY:${summary}]`;

  try{
    if(existingFbId){
      await api.put(`/feedback/${existingFbId}`, { comment: fullComment, pass_status: passStatus });
      showA('✅ Feedback berhasil diperbarui.', 'success');
    } else {
      await api.post('/feedback', { recording_id: recId, comment: fullComment, pass_status: passStatus });
      if(passStatus === 'lulus'){
        showA('✅ Feedback dikirim! Level berikutnya otomatis terbuka untuk siswa.', 'success');
      } else {
        showA('📤 Feedback dikirim. Siswa akan mendapat notifikasi untuk rekam ulang.', 'success');
      }
    }
    setTimeout(()=>loadRecordings(), 1500);
  }catch(e){
    showA(e.message || 'Gagal menyimpan feedback.');
  }
}

// ── Init ─────────────────────────────────────────────────────────────────────
(async()=>{
  await loadLevelFilter();
  await loadRecordings();
})();
</script>
